name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        # The hosted Sequoia ARM runner intermittently crashes while compiling AppIcon.icon.
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode 26.3 on macOS 15
        if: matrix.os == 'macos-15-intel'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Test Core
        run: swift test --package-path Core

      - name: Build Core for the iOS simulator
        if: matrix.os == 'macos-26'
        working-directory: Core
        run: xcodebuild -scheme OboloCore -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

      - name: Generate the Mac project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test the Mac app
        run: xcodebuild -project Obolo.xcodeproj -scheme Obolo -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test

  distribution:
    name: Archive ${{ matrix.scheme }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - spec: project-direct.yml
            project: OboloDirect
            scheme: Obolo Direct
          - spec: project-store.yml
            project: OboloStore
            scheme: Obolo App Store
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Generate the distribution project
        run: |
          brew install xcodegen
          xcodegen generate --spec '${{ matrix.spec }}'

      - name: Archive without signing credentials
        run: |
          xcodebuild -project '${{ matrix.project }}.xcodeproj' -scheme '${{ matrix.scheme }}' \
            -destination 'generic/platform=macOS' -archivePath "$RUNNER_TEMP/Obolo.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/packages" \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Verify the archived app
        run: |
          app="$RUNNER_TEMP/Obolo.xcarchive/Products/Applications/Obolo.app"
          info="$app/Contents/Info.plist"
          settings=$(xcodegen dump --type json | jq -e '.targets.Obolo.settings.base')
          test "$(plutil -extract CFBundleIdentifier raw -o - "$info")" = "$(jq -er .PRODUCT_BUNDLE_IDENTIFIER <<< "$settings")"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$info")" = "$(jq -er .MARKETING_VERSION <<< "$settings")"
          test "$(plutil -extract CFBundleVersion raw -o - "$info")" = "$(jq -er .CURRENT_PROJECT_VERSION <<< "$settings")"
          lipo "$app/Contents/MacOS/Obolo" -verify_arch arm64
          lipo "$app/Contents/MacOS/Obolo" -verify_arch x86_64

      - name: Verify the updater for this edition
        run: |
          app="$RUNNER_TEMP/Obolo.xcarchive/Products/Applications/Obolo.app"
          framework="$app/Contents/Frameworks/Sparkle.framework"
          otool -L "$app/Contents/MacOS/Obolo" > "$RUNNER_TEMP/linked-libraries"
          if [[ '${{ matrix.project }}' == OboloDirect ]]; then
            grep -F 'Sparkle.framework/' "$RUNNER_TEMP/linked-libraries"
            test -x "$framework/Versions/Current/XPCServices/Installer.xpc/Contents/MacOS/Installer"
            cmp licenses/Sparkle.txt "$app/Contents/Resources/Sparkle.txt"
            test "$(plutil -extract SURequireSignedFeed raw "$app/Contents/Info.plist")" = true
            test "$(plutil -extract SUVerifyUpdateBeforeExtraction raw "$app/Contents/Info.plist")" = true
            test "$(plutil -extract SUEnableAutomaticChecks raw "$app/Contents/Info.plist")" = true
            test "$(plutil -extract SUAllowsAutomaticUpdates raw "$app/Contents/Info.plist")" = false
          else
            test ! -e "$framework"
            if grep -F 'Sparkle.framework/' "$RUNNER_TEMP/linked-libraries" || plutil -extract SUFeedURL raw "$app/Contents/Info.plist"; then
              echo "Unexpected updater in the Mac App Store archive" >&2
              exit 1
            fi
          fi

      - name: Test signing and verifying a disposable update
        if: matrix.project == 'OboloDirect'
        run: python3 scripts/test_direct_release.py "$RUNNER_TEMP/packages"
